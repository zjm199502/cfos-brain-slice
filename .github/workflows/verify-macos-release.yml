name: Verify macOS release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric GitHub release ID (published release or draft)
        required: true
        type: string
  release:
    types: [published]

permissions: {}

jobs:
  fetch:
    if: github.repository == 'zjm199502/cfos-brain-slice'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # GitHub restricts visibility of draft releases to users with push access.
      contents: write
    outputs:
      version: ${{ steps.fetch.outputs.version }}
      sha256: ${{ steps.fetch.outputs.sha256 }}
      format: ${{ steps.fetch.outputs.format }}
    steps:
      - name: Fetch the official release asset
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id || github.event.release.id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          repo=zjm199502/cfos-brain-slice
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || fail 'A numeric release ID is required.'
          echo "Reading $repo release ID $RELEASE_ID"
          gh api "repos/$repo/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json" || fail "Cannot read release $RELEASE_ID. Check the ID and access to the draft."
          tag=$(jq -er .tag_name "$RUNNER_TEMP/release.json")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail 'Release tag must use vX.Y.Z.'
          if [[ "$tag" == v0.* ]]; then
            name="FosFolio-${tag#v}-macOS-arm64.zip"
            format=zip
          else
            name="FosFolio-${tag#v}-macOS-arm64-Offline-Compact.tar.xz"
            format=tar.xz
          fi
          echo "format=$format" >> "$GITHUB_OUTPUT"
          metadata=$(jq -ec --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded")' "$RUNNER_TEMP/release.json") || fail "Uploaded asset $name is missing from release $RELEASE_ID."
          asset_id=$(jq -er .id <<< "$metadata")
          digest=$(jq -er '.digest | select(type == "string") | ltrimstr("sha256:")' <<< "$metadata") || fail "No SHA-256 digest found for asset $asset_id."
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid SHA-256 digest for asset $asset_id."
          cd "$RUNNER_TEMP"
          echo "Downloading $name, asset $asset_id"
          gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$asset_id" > bundle.archive || fail "Failed to download asset $asset_id."
          printf '%s  bundle.archive\n' "$digest" | sha256sum -c -
          printf 'version=%s\nsha256=%s\n' "${tag#v}" "$digest" >> "$GITHUB_OUTPUT"
      - name: Transfer the verified archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-archive
          path: ${{ runner.temp }}/bundle.archive
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: fetch
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.fetch.outputs.version }}
      PIP_NO_CACHE_DIR: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/mac
            tests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-archive
          path: ${{ runner.temp }}
      - name: Check digest and unpack on macOS
        env:
          digest: ${{ needs.fetch.outputs.sha256 }}
          format: ${{ needs.fetch.outputs.format }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          printf '%s  bundle.archive\n' "$digest" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/fosfolio"
          if [[ "$format" == tar.xz ]]; then
            /usr/bin/tar -xf bundle.archive -C "$RUNNER_TEMP/fosfolio"
          else
            ditto -x -k bundle.archive "$RUNNER_TEMP/fosfolio"
          fi
          printf 'BUNDLE=%s\n' "$RUNNER_TEMP/fosfolio/FosFolio脑片图册.app" >> "$GITHUB_ENV"
      - name: Validate native launcher, GUI, demo and atlas registration
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          py="$BUNDLE/Contents/Resources/python/bin/python3"
          lipo "$py" -verify_arch arm64
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$BUNDLE/Contents/Info.plist")" = "$EXPECTED_VERSION"
          "$BUNDLE/Contents/MacOS/cfos" --version | tee "$RUNNER_TEMP/launcher.txt"
          grep -F "$EXPECTED_VERSION" "$RUNNER_TEMP/launcher.txt"
          "$py" -c 'from qtpy.QtCore import QSettings; s=QSettings("cfos","cfos脑片分析"); s.setValue("cellposeOfflineSetupOffered", True); s.sync()'
          "$py" packaging/mac/verify_bundle.py "$BUNDLE" app
      - name: Test the fixes with the packaged application
        if: needs.fetch.outputs.format == 'tar.xz'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          app="$BUNDLE/Contents/Resources/app"
          export PYTHONPATH="$app"
          py="$BUNDLE/Contents/Resources/python/bin/python3"
          test -x "$app/cfos/core/giraff_runtime/bin/reg_aladin"
          for test in test_coloc_cache_coordinates.py test_cell_ring_navigation.py test_rotated_pan.py; do
            "$py" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p "$test" -v
          done
      - name: Install Cellpose, run CPU inference and test MPS when available
        env:
          format: ${{ needs.fetch.outputs.format }}
        run: |
          set -euo pipefail
          phase=cellpose
          if [[ "$format" == tar.xz ]]; then phase=cellpose-offline; fi
          "$BUNDLE/Contents/Resources/python/bin/python3" packaging/mac/verify_bundle.py "$BUNDLE" "$phase"
