name: Mac in-app 0.9 to 1.0 acceptance
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable candidate installers commit SHA
        required: true
      digest:
        description: SHA-256 of the staged v1.0.0 macOS patch
        required: true
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/mac
            tests
      - name: Unpack released 0.9.0 Mac and install offline environment
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o base.txz https://github.com/zjm199502/cfos-brain-slice/releases/download/v0.9.0/FosFolio-0.9.0-macOS-arm64-Offline-Compact.tar.xz
          echo 'ba1cb6f80de6a1846901d85fb80eda97230cad30d5f3a2ec0a6b3446331c2c85  base.txz' | shasum -a 256 -c -
          /usr/bin/tar -xf base.txz
          bundle="$RUNNER_TEMP/FosFolio脑片图册.app"
          echo "BASE_APP=$bundle/Contents/Resources/app" >> "$GITHUB_ENV"
          echo "LAUNCH=$bundle/Contents/MacOS/cfos" >> "$GITHUB_ENV"
          echo "PY=$bundle/Contents/Resources/python/bin/python3" >> "$GITHUB_ENV"
          "$bundle/Contents/MacOS/cfos" --version | grep -F v0.9.0
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' "$bundle/Contents/MacOS/cfos" --install-cellpose-offline
      - name: Apply actual 0.9.22 then staged 1.0.0 and restart twice
        env:
          CANDIDATE: ${{ inputs.candidate }}
          SHA: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ && "$SHA" =~ ^[0-9a-f]{64}$ ]]
          host=https://raw.githubusercontent.com/zjm199502/cfos-brain-slice
          old="$host/25ec34f498b68710339ec5e19db7e77a5fd97f3e/updates/v0.9/macos/latest.json"
          staging="$host/$CANDIDATE/updates/v0.9/macos/latest.json"
          future="$host/$CANDIDATE/updates/v1.0/macos/latest.json"
          qa="$GITHUB_WORKSPACE/packaging/mac/verify_in_app_100.py"
          cd "$RUNNER_TEMP"
          "$PY" "$qa" install 0.9.0 "$old" 0.9.22 a9cb372bb7c24e70e15cfa93cbec1e231bdf5d92fed21711a5cf7f873536930d
          "$LAUNCH" --version | grep -F v0.9.22
          "$PY" "$qa" snapshot 0.9.22 "$old"
          "$PY" "$qa" install 0.9.22 "$staging" 1.0.0 "$SHA"
          "$LAUNCH" --version | grep -F v1.0.0
          "$LAUNCH" --version | grep -F v1.0.0
          "$PY" "$qa" restarted 1.0.0 "$future"
